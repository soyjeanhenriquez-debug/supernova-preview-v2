project_id = "krfdoofwhtcxbyhkjoik"

# verify_jwt = false SOLO donde quien llama no puede traer un JWT de usuario.
# Ninguna queda abierta: cada una se autentica por su cuenta dentro del código.
# (Todas las demás funciones usan el valor por defecto, verify_jwt = true, y
# además exigen un USUARIO real con acceso: la llave pública del bundle también
# es un JWT válido para el gateway.)

# Proxy de previews: lo cacheado es público; un anuncio sin caché (scrape de
# pago) exige usuario con acceso dentro de la función.
[functions.meta-ad-proxy]
verify_jwt = false

# Invocadas por pg_cron → cabecera x-cron-secret (Vault) o admin con sesión.
[functions.master-rotate]
verify_jwt = false

[functions.enrich-offers]
verify_jwt = false

[functions.generate-kit]
verify_jwt = false

[functions.extract-hooks]
verify_jwt = false

[functions.send-daily-digest]
verify_jwt = false

# Webhooks de terceros.
# Stripe: no se confía en el cuerpo; se vuelve a pedir el evento a Stripe por id.
[functions.stripe-webhook]
verify_jwt = false

# Whop: firma HMAC (Standard Webhooks) con WHOP_WEBHOOK_SECRET.
[functions.whop-webhook]
verify_jwt = false

# HeyGen: no firma sus webhooks; solo actualiza un job nuestro por video_id.
[functions.heygen-webhook]
verify_jwt = false

# Ficha de oferta: la abre el usuario y también pg_cron (precalienta ganadoras).
# Compuerta propia dentro del código: usuario con acceso + tope, o secreto de cron.
[functions.offer-intel]
verify_jwt = false

# Renueva el token de Meta (lo llama pg_cron a diario). Compuerta propia: secreto de cron o admin.
[functions.fb-token-keeper]
verify_jwt = false

# Correo con las 3 ofertas del popup de salida de /fundador/ (lo llama pg_cron cada 15 min).
[functions.landing-lead-welcome]
verify_jwt = false

# Descarga los feeds del Mercado (lo llama pg_cron a diario). Compuerta propia: secreto de cron o admin.
[functions.market-feed-sync]
verify_jwt = false

# "Entrar como este usuario" (Admin → Usuarios). Compuerta propia: admin con sesión o secreto de cron.
[functions.admin-impersonate]
verify_jwt = false

# Correo diario de alertas al admin (pg_cron). Compuerta propia: secreto de cron o admin.
[functions.health-alert]
verify_jwt = false
