<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#F5F8FF">
<!-- Marca: si cambia, editar aquí (title y og) y la constante BRAND del primer script. -->
<title>Edúcate con IA · Aprende IA práctica en 28 días, 15 minutos al día</title>
<meta name="description" content="Edúcate con IA: reto de 28 días para aprender IA práctica, 15 minutos al día. Desde cero, en español, con ejemplos de tu trabajo real.">
<meta property="og:site_name" content="Edúcate con IA">
<meta property="og:title" content="Edúcate con IA · Aprende IA práctica en 28 días, 15 minutos al día">
<meta property="og:description" content="Responde unas preguntas y recibe tu plan de 28 días para usar la IA en tu trabajo real, desde cero.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F5F8FF;--card:#FFFFFF;--line:#DCE4F3;--ink:#14213D;--dim:#56627A;--brand:#2563EB;--brand-d:#1D4ED8;--soft:#EAF1FF;--warm:#FF8A3D;--warm-d:#F47420;--wsoft:#FFF1E6;--ok:#0E9F66;--okbg:#E8F7F0;--err:#C0262D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
html:not([data-v="B"]) [data-ab="B"]{display:none!important}
html[data-v="B"] [data-ab="A"]{display:none!important}

/* Cabecera y progreso */
.top{position:sticky;top:0;z-index:20;background:rgba(245,248,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.top-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:56px;padding:0 8px}
.icon{width:44px;height:44px;border:0;background:none;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.icon:hover{background:var(--soft)}
.icon[hidden]{display:flex!important;visibility:hidden}
.logo{text-align:center;font-weight:800;letter-spacing:-.02em;font-size:18px}
.logo .b1{color:var(--brand)}.logo .b2{color:var(--warm)}
.step{text-align:right;font-size:13px;font-weight:700;color:var(--dim);padding-right:6px}
.prog{max-width:560px;margin:0 auto;padding:0 16px 8px}
.prog-t{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.prog-t i{display:block;height:100%;width:0;border-radius:6px;background:var(--warm);transition:width .35s ease}
.prog[hidden]{display:block!important;visibility:hidden}

/* Pantallas */
main{max-width:560px;margin:0 auto;padding:18px 16px 48px}
.scr{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scr,.ask{animation:none}.prog-t i,.meter .t i{transition:none}.today .dot{animation:none}}
h1{font-size:clamp(1.85rem,7.4vw,2.5rem);line-height:1.08;letter-spacing:-.035em;font-weight:800}
h1 em{font-style:normal;color:var(--brand)}
.qt{font-size:clamp(1.4rem,5.6vw,1.8rem);line-height:1.18;letter-spacing:-.025em;font-weight:800;outline:none}
.qs{color:var(--dim);margin-top:8px;font-size:15.5px}
.sub{color:var(--dim);font-size:clamp(1rem,4vw,1.12rem);margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--soft);color:var(--brand-d);font-weight:800;font-size:12.5px;letter-spacing:.02em;border-radius:999px;padding:7px 13px;margin-bottom:14px}
.today{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;font-weight:700;color:var(--ok);background:var(--okbg);border-radius:999px;padding:6px 12px}
.today .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(14,159,102,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(14,159,102,0)}100%{box-shadow:0 0 0 0 rgba(14,159,102,0)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;color:var(--dim)}
.ql{font-size:1.12rem;font-weight:800;margin:26px 0 12px;letter-spacing:-.01em;outline:none}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--brand)}

/* Opciones */
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-weight:600;font-size:1.02rem;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:#A9C1F5}
.opt:active{transform:scale(.99)}
.opt.sel,.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--soft)}
.opt:disabled{opacity:.6;cursor:wait}
.opt .ic{font-size:1.45rem;line-height:1;flex:none;width:30px;text-align:center}
.opt .lb{flex:1}
.opt .ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800}
.opt[aria-pressed="true"] .ck{background:var(--brand);border-color:var(--brand)}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gender .opt{flex-direction:column;justify-content:center;text-align:center;min-height:112px;gap:6px;font-size:1.08rem}
.gender .opt .ic{font-size:2rem;width:auto}
.gender .full{grid-column:1/-1;min-height:56px;flex-direction:row}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.yn .opt{flex-direction:column;justify-content:center;text-align:center;min-height:120px;font-size:1.15rem;font-weight:800}
.yn .opt .ic{font-size:2.1rem;width:auto}

/* Botones (naranja con texto oscuro para buen contraste) */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:16px;padding:14px 20px;font-weight:800;font-size:1.08rem;cursor:pointer;background:var(--warm);color:#1A1206;box-shadow:0 14px 30px -14px rgba(244,116,32,.8);transition:background .15s,transform .1s}
.btn:hover{background:var(--warm-d)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.cta-wrap{margin-top:22px}
.link{display:block;margin:14px auto 0;background:none;border:0;color:var(--dim);font-size:14px;font-weight:600;text-decoration:underline;cursor:pointer;padding:8px}
.fine{font-size:12.5px;color:var(--dim);margin-top:10px}
.err{color:var(--err);font-size:14px;font-weight:600;margin-top:10px}

/* Pantallas de ánimo */
.info{text-align:center;padding-top:24px}
.info .big{width:112px;height:112px;margin:0 auto 22px;border-radius:32px;background:linear-gradient(135deg,var(--soft),var(--wsoft));display:flex;align-items:center;justify-content:center;font-size:3.2rem}
.info p{color:var(--dim);font-size:1.05rem;margin-top:12px}
.info .src{font-size:12.5px;margin-top:14px}

/* Cargando */
.load{text-align:center;padding-top:28px}
.ring{position:relative;width:168px;height:168px;margin:0 auto 22px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:800;letter-spacing:-.03em}
.checks{list-style:none;max-width:320px;margin:22px auto 0;text-align:left;display:grid;gap:10px}
.checks li{display:flex;gap:10px;align-items:center;color:var(--dim);font-weight:600;opacity:.4;transition:opacity .3s}
.checks li.on{opacity:1;color:var(--ink)}
.checks li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#fff}
.checks li.on i{background:var(--ok);border-color:var(--ok)}
.ask-bg{position:fixed;inset:0;z-index:40;background:rgba(20,33,61,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media(min-width:600px){.ask-bg{align-items:center}}
.ask{width:100%;max-width:460px;background:var(--card);border-radius:22px;padding:24px 20px 20px;box-shadow:0 30px 60px -20px rgba(20,33,61,.4);animation:in .25s ease both}
.ask .qt{font-size:1.3rem;margin-top:6px}
.ask .yn{margin-top:18px}
.ask .yn .opt{min-height:84px}

/* Perfil */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.meter{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.meter .k{font-size:13px;color:var(--dim);font-weight:600;line-height:1.3;min-height:34px}
.meter .v{font-size:1.1rem;font-weight:800;margin-top:4px}
.meter .t{height:8px;border-radius:8px;background:var(--line);margin-top:8px;overflow:hidden}
.meter .t i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--brand),#5B8DEF);width:0;transition:width .9s ease}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14.5px;color:#27406F}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.card h3{font-size:1.2rem;line-height:1.25;letter-spacing:-.02em}
.card .d{color:var(--dim);font-size:14.5px;margin-top:6px}
.chart{width:100%;height:auto;margin-top:12px;display:block}
.cap{font-size:12px;color:var(--dim);margin-top:6px}
.weeks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.weeks div{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;color:var(--dim)}
.weeks div b{display:block;color:var(--ink);font-size:13.5px}

/* Contacto */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--line);border-radius:14px;padding:4px;margin-top:20px}
.seg button{border:0;background:none;border-radius:11px;min-height:46px;font-weight:700;cursor:pointer;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px -2px rgba(20,33,61,.18)}
.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.field input{width:100%;min-height:56px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:500 1.05rem "Plus Jakarta Sans",sans-serif;color:var(--ink);outline:none}
.field input:focus{border-color:var(--brand)}
.lock{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--dim);margin-top:12px}

/* Raspa y gana (honesto) */
.scratch{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative;margin:22px auto 0;max-width:360px;aspect-ratio:16/10;border-radius:22px;overflow:hidden;box-shadow:0 20px 40px -24px rgba(20,33,61,.5)}
.prize{position:absolute;inset:0;background:linear-gradient(135deg,var(--wsoft),#FFE0C7);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
.prize .pc{font-size:3.2rem;font-weight:800;letter-spacing:-.04em;color:var(--warm-d);line-height:1}
.prize .pl{font-weight:800;font-size:1.05rem;margin-top:6px}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .5s}
.scratch.done canvas{opacity:0;pointer-events:none}
.honest{text-align:center;color:var(--dim);font-size:14px;margin-top:12px}

/* Precio */
.timer{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:600;text-align:center}
.timer b{font-variant-numeric:tabular-nums;color:#FFC59E}
.cmp{width:100%;border-collapse:separate;border-spacing:0;margin-top:14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);font-size:14px;text-align:left}
.cmp th,.cmp td{padding:10px 12px;border-top:1px solid var(--line);font-weight:600;vertical-align:top}
.cmp thead th{border-top:0;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--dim);background:#F8FAFF}
.cmp .now{color:var(--dim)}
.cmp .goal{font-weight:800;color:var(--brand-d)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.readiness{display:flex;align-items:center;gap:14px;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.readiness .n{font-size:2rem;font-weight:800;color:var(--brand);letter-spacing:-.03em;line-height:1}
.readiness .t2{font-size:14px;color:var(--dim)}
.readiness .t2 b{color:var(--ink);display:block;font-size:15px}
.pcard{background:var(--card);border:2px solid var(--warm);border-radius:22px;padding:20px;margin-top:18px;box-shadow:0 24px 50px -30px rgba(244,116,32,.6)}
.ptag{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.06em;background:var(--wsoft);color:#9A3F06;border-radius:999px;padding:5px 10px}
.pname{font-weight:800;font-size:1.1rem;margin-top:10px}
.anchor{color:var(--dim);font-size:15px;margin-top:10px}
.anchor s{text-decoration-thickness:2px;text-decoration-color:var(--err)}
.amount{font-size:2.5rem;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:2px}
.amount small{font-size:1rem;font-weight:600;color:var(--dim);letter-spacing:0}
.then{font-size:15px;margin-top:4px}
.renew{background:#F8FAFF;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:#34405A;margin-top:12px}
.renew b{color:var(--ink)}
ul.inc{list-style:none;display:grid;gap:10px;margin-top:12px}
ul.inc li{position:relative;padding-left:30px;font-size:15px}
ul.inc li::before{content:"✓";position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--okbg);color:var(--ok);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.guar{display:flex;gap:14px;align-items:flex-start;background:var(--okbg);border:1px solid #BFE9D5;border-radius:18px;padding:16px;margin-top:16px}
.guar .gi{font-size:1.9rem;line-height:1}
.guar p{font-size:14.5px;color:#27513F;margin-top:2px}
h3.sec{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;margin-top:30px}
.days{list-style:none;display:grid;gap:10px;margin-top:12px}
.days li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.days li b{flex:none;width:58px;font-size:12px;font-weight:800;color:var(--brand-d);background:var(--soft);border-radius:9px;padding:6px 0;text-align:center}
.days li span{font-size:14.5px;font-weight:600}
.bens{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bens div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font-size:13px;font-weight:700}
.bens div span{display:block;font-size:1.5rem;margin-bottom:4px}
.first{background:linear-gradient(135deg,var(--soft),var(--wsoft));border-radius:18px;padding:16px;margin-top:16px}
.first b{display:block;font-size:1.05rem}
.first p{font-size:14.5px;color:#34405A;margin-top:4px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:8px}
.faq summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:"+";color:var(--brand);font-weight:800}
.faq details[open] summary::after{content:"–"}
.faq summary::-webkit-details-marker{display:none}
.faq p{color:var(--dim);margin-top:8px;font-size:14.5px}
.legal{font-size:12px;color:var(--dim);margin-top:30px;padding-top:16px;border-top:1px solid var(--line)}
.done{text-align:center;padding-top:20px}
.done .big{width:96px;height:96px;margin:0 auto 18px;border-radius:28px;background:var(--okbg);display:flex;align-items:center;justify-content:center;font-size:2.8rem}
</style>
<script>
// Marca en un solo lugar (también está escrita en <title> y og:* arriba).
window.BRAND='Edúcate con IA';
(function(){
  // Test A/B: cada visitante ve siempre la misma versión; ?v=a o ?v=b la fija (un conjunto de anuncios por versión).
  var K='ism_ab_v1',v=null,q=new URLSearchParams(location.search),f=(q.get('v')||'').toUpperCase();
  try{v=localStorage.getItem(K)}catch(e){}
  if(f==='A'||f==='B')v=f;
  if(v!=='A'&&v!=='B')v=Math.random()<.5?'A':'B';
  try{localStorage.setItem(K,v)}catch(e){}
  window.__ab=v;document.documentElement.setAttribute('data-v',v);
})();
</script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="icon" id="back" type="button" aria-label="Volver a la pantalla anterior" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div class="logo" id="logo">Edúcate con IA</div>
    <div class="step" id="step" aria-live="polite"></div>
  </div>
  <div class="prog" id="prog" hidden>
    <div class="prog-t" role="progressbar" aria-label="Avance del cuestionario" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progt"><i id="bar"></i></div>
  </div>
</header>

<main id="app">
  <noscript><p style="padding:24px 0">Para armar tu plan necesitas activar JavaScript en tu navegador.</p></noscript>
</main>

<script>
(function(){
  var BRAND=window.BRAND||'Edúcate con IA';
  var SLUG='ia-sin-miedo', V=window.__ab||'A';
  // Cuando existan los productos en Whop, se pegan aquí sus enlaces de pago (uno por moneda).
  // Mientras estén vacíos, el botón funciona como PREVENTA: guarda el contacto y mide la intención real de compra.
  var CHECKOUT={us:'',co:'',mx:''};
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyZmRvb2Z3aHRjeGJ5aGtqb2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMjMzMDQsImV4cCI6MjA5ODY5OTMwNH0.2QsRkQgQ64KB5ignkAtBwHQZemVC9KxPBH8QiV4tRC8';
  function rpc(fn,body){return fetch('https://krfdoofwhtcxbyhkjoik.supabase.co/rest/v1/rpc/'+fn,{method:'POST',keepalive:true,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})}
  function track(ev){try{rpc('funnel_track',{p_slug:SLUG,p_variant:V,p_event:ev}).catch(function(){})}catch(e){}}
  track('view');

  // Logo: primera palabra en azul, el resto en naranja.
  (function(){var p=BRAND.split(' '),l=document.getElementById('logo');
    l.innerHTML='<span class="b1">'+esc(p[0])+'</span>'+(p.length>1?' <span class="b2">'+esc(p.slice(1).join(' '))+'</span>':'');})();

  // Precio local: ?pais=co | ?pais=mx ; por defecto USD. El ancla es el precio normal de renovación.
  var qp=new URLSearchParams(location.search);
  var PA=(qp.get('pais')||'').toLowerCase(); if(PA!=='co'&&PA!=='mx')PA='us';
  var PR={
    us:{f:'US$7,90',l:'US$29,90',nf:7.9,nl:29.9,ph:'+ código de país y número'},
    co:{f:'COP 25.900',l:'COP 95.900',nf:25900,nl:95900,ph:'+57 300 123 4567'},
    mx:{f:'MXN 139',l:'MXN 519',nf:139,nl:519,ph:'+52 55 1234 5678'}
  }[PA];
  // Descuento real calculado (no redondeado hacia arriba): 73 % en USD y MXN, 72 % en COP.
  var OFF=Math.floor((1-PR.nf/PR.nl)*100);

  // Preguntas. Claves y códigos cortos para que las respuestas quepan en funnel_lead (≤1000 bytes).
  // {o|a} se ajusta al género elegido en la portada.

      '<div class="timer" role="timer"><span>Precio de lanzamiento hasta el '+endTxt+'</span><b id="cd"></b></div>'+
      '<h2 class="qt" tabindex="-1" style="margin-top:18px">Tu plan para '+esc(lc(goalTxt()))+' está listo</h2>'+
      '<table class="cmp"><caption class="sr">Ahora frente a tu objetivo</caption>'+
        '<thead><tr><th scope="col"><span class="sr">Aspecto</span></th><th scope="col">AHORA</th><th scope="col">OBJETIVO</th></tr></thead><tbody>'+
        '<tr><th scope="row">Habilidades de IA</th><td class="now">'+skill+'</td><td class="goal">Alta</td></tr>'+
        '<tr><th scope="row">Tiempo ahorrado</th><td class="now">Poco</td><td class="goal">Mucho</td></tr>'+
        '<tr><th scope="row">Confianza con la IA</th><td class="now">'+conf+'</td><td class="goal">Alta</td></tr>'+
      '</tbody></table>'+
      '<div class="readiness"><div class="n">'+rd+'%</div><div class="t2"><b>Tu preparación para el reto</b>Calculada con tu motivación, tu enfoque y el tiempo que puedes ahorrar.</div></div>'+
      '<div class="pcard"><span class="ptag">'+OFF+'% DE DESCUENTO DE LANZAMIENTO</span>'+
        '<div class="pname">Reto '+esc(BRAND)+' · 28 días</div>'+
        '<div class="anchor">Precio normal <s>'+PR.l+'</s> cada 4 semanas</div>'+
        '<div class="amount">'+PR.f+' <small>primeras 4 semanas</small></div>'+
        '<div class="then">Luego '+PR.l+' cada 4 semanas. Cancelas cuando quieras con un clic.</div>'+
        buy('Quiero mi acceso')+
      '</div>'+
      '<div class="guar"><div class="gi" aria-hidden="true">🛡️</div><div><b>Garantía de 30 días, sin letra pequeña</b><p>Si no te sirve, te devolvemos tu dinero. Nos escribes y listo.</p></div></div>'+

      '<h3 class="sec">Tu plan está listo</h3><p class="qs">Así empiezan tus primeros días:</p>'+
      '<ul class="days">'+days.map(function(d){return '<li><b>'+d[0]+'</b><span>'+esc(d[1])+'</span></li>'}).join('')+'</ul>'+
      '<div class="bens"><div><span aria-hidden="true">🐣</span>Sin experiencia previa</div><div><span aria-hidden="true">📱</span>Desde tu celular</div><div><span aria-hidden="true">🕒</span>A tu ritmo</div></div>'+

      '<h3 class="sec">Qué obtienes</h3>'+
      '<ul class="inc">'+
        '<li><b>28 lecciones de 15 minutos</b>, cada una con video o audio corto, un ejercicio y un prompt listo para copiar</li>'+
        '<li><b>Más de 100 prompts por oficio</b> para usar desde el primer día</li>'+
        '<li><b>Grupo de dudas por WhatsApp</b>, donde ninguna pregunta es tonta</li>'+
        '<li><b>Certificado</b> al terminar el reto</li>'+
        '<li><b>Aviso por WhatsApp 3 días antes</b> de cada cobro</li>'+
      '</ul>'+
      '<div class="first"><b>Sé de los primeros</b><p>Estamos abriendo el reto y queremos acompañar de cerca a quienes empiezan ahora: te escribimos personalmente para saber cómo vas y ajustar lo que haga falta.</p></div>'+

      '<h3 class="sec">Preguntas frecuentes</h3>'+
      '<div class="faq">'+
        '<details><summary>¿Puedo hacerlo si tengo 40, 50 años o más?</summary><p>Sí. El reto no da nada por sabido: empieza por cómo abrir la herramienta y qué escribirle. La edad no es un obstáculo; lo que cuenta es practicar un poco cada día.</p></details>'+
        '<details><summary>¿Y si no tengo tiempo?</summary><p>Cada lección toma unos 15 minutos y la haces cuando te acomode: en el transporte, en tu pausa o antes de dormir. Si un día no puedes, retomas donde quedaste.</p></details>'+
        '<details><summary>¿Entenderé si soy principiante?</summary><p>Sí, está pensado para principiantes: lenguaje simple, sin tecnicismos y un grupo de WhatsApp para preguntar lo que sea.</p></details>'+
        '<details><summary>¿Qué tan rápido veré resultados?</summary><p>Depende de cuánto practiques. Cada lección termina con un ejercicio que puedes aplicar ese mismo día en algo real, como un correo o un resumen, pero no te prometemos resultados en un plazo fijo.</p></details>'+
        '<details><summary>¿Qué pasa si no me gusta?</summary><p>Tienes 30 días de garantía sin letra pequeña: nos escribes y te devolvemos tu dinero. Además, puedes cancelar la renovación con un clic cuando quieras.</p></details>'+
        '<details><summary>¿Necesito computadora?</summary><p>No. Puedes hacer todo el reto desde tu celular. Si tienes computadora, también te sirve.</p></details>'+
        '<details><summary>¿Sirve si no tengo experiencia?</summary><p>Sí. No necesitas saber programar ni haber usado IA antes. Empezamos desde cero.</p></details>'+
        '<details><summary>¿Tengo que pagar ChatGPT u otra herramienta?</summary><p>No. Todo el reto funciona con las versiones gratuitas de las herramientas.</p></details>'+
      '</div>'+
      buy('Quiero mi acceso por '+PR.f)+
      legal()+'</section>';
  }

  function vPre(){
    if(CONTACT){
      return '<section class="scr done"><div class="big" aria-hidden="true">🎉</div>'+
        '<h2 class="qt" tabindex="-1">¡Tu lugar está guardado!</h2>'+
        '<p class="qs">Abrimos inscripciones muy pronto y te guardamos tus primeras 4 semanas a '+PR.f+'. Te avisamos a <b>'+esc(CONTACT)+'</b> apenas abramos. No tienes que hacer nada más.</p>'+legal()+'</section>';
    }
    return '<section class="scr"><div class="eyebrow">PREVENTA</div>'+
      '<h2 class="qt" tabindex="-1" style="margin-top:6px">Abrimos inscripciones muy pronto</h2>'+
      '<p class="qs">Te guardamos tus primeras 4 semanas a '+PR.f+'. ¿A dónde te avisamos?</p>'+contactForm('p')+'</section>';
  }

  // ---------- Motor ----------
  function header(id){
    var qi=QIDS.indexOf(id), before=ORDER.indexOf(id);
    backB.hidden=(idx===0||id==='load');
    if(id==='g'){prog.hidden=true;stepE.textContent='';return}
    prog.hidden=false;
    var p=100;
    if(qi>-1||INFO[id]){
      var n=qi>-1?qi+1:QIDS.filter(function(x){return ORDER.indexOf(x)<before}).length;
      p=Math.round(n/TOTAL*100);
    }
    bar.style.width=p+'%';progt.setAttribute('aria-valuenow',p);
    stepE.textContent=qi>-1?(qi+1)+'/'+TOTAL:'';
  }

  var VIEWS={load:vLoad,res:vResult,contact:vContact,anc:vAnchor,ready:vReady,scratch:vScratch,price:vPrice,pre:vPre};
  function render(i){
    if(loadTimer){clearInterval(loadTimer);loadTimer=null}
    if(clock){clearInterval(clock);clock=null}
    idx=Math.max(0,Math.min(ORDER.length-1,i|0));
    var id=ORDER[idx];
    header(id);
    app.innerHTML=id==='g'?vCover():Q[id]?vQuestion(id):INFO[id]?vInfo(id):VIEWS[id]();
    if(!firstRender){window.scrollTo(0,0);var h=app.querySelector('[tabindex="-1"]');if(h)try{h.focus({preventScroll:true})}catch(e){h.focus()}}
    firstRender=false;
    if(id==='load')startLoad();
    if(id==='res'){
      if(!doneTracked){doneTracked=true;track('quiz_done')}
      setTimeout(function(){app.querySelectorAll('.meter .t i').forEach(function(el){el.style.width=el.getAttribute('data-w')+'%'})},60);
    }
    if(id==='scratch'&&!revealed)initScratch();
    if(id==='price')startClock();
  }
  function go(i){try{history.pushState({s:i},'')}catch(e){}render(i)}
  function next(){go(idx+1)}
  function goId(id){go(ORDER.indexOf(id))}

  window.addEventListener('popstate',function(e){
    var s=e.state&&typeof e.state.s==='number'?e.state.s:0;
    if(ORDER[s]==='load')s=ORDER.indexOf('te');
    render(s);
  });
  backB.addEventListener('click',function(){if(idx>0)history.back()});

  function startLoad(){
    var p=0, asked={}, pct=document.getElementById('pct'), arc=document.getElementById('arc'), C=2*Math.PI*72, slot=document.getElementById('askslot'), paused=false;
    function draw(){pct.textContent=Math.round(p)+'%';arc.setAttribute('stroke-dashoffset',(C*(1-p/100)).toFixed(1));
      ['c1','c2','c3'].forEach(function(c,k){if(p>=[22,55,88][k])document.getElementById(c).classList.add('on')})}
    function ask(key,text){
      paused=true;
      slot.innerHTML='<div class="ask-bg"><div class="ask" role="dialog" aria-modal="true" aria-labelledby="askt"><div class="eyebrow">PREGUNTA RÁPIDA</div><h3 class="qt" id="askt" tabindex="-1">'+esc(text)+'</h3>'+
        '<div class="yn"><button type="button" class="opt" data-ask="'+key+':1"><span class="ic" aria-hidden="true">👍</span>Sí</button><button type="button" class="opt" data-ask="'+key+':0"><span class="ic" aria-hidden="true">👎</span>No</button></div></div></div>';
      var t=document.getElementById('askt');if(t)t.focus();
    }
    slot.addEventListener('click',function(e){
      var b=e.target.closest('[data-ask]');if(!b)return;
      var kv=b.getAttribute('data-ask').split(':');A[kv[0]]=+kv[1];slot.innerHTML='';paused=false;
    });
    draw();
    loadTimer=setInterval(function(){
      if(paused)return;
      if(p>=34&&!asked.ej){asked.ej=1;ask('ej','¿Prefieres practicar con ejemplos de tu propio trabajo?');return}
      if(p>=68&&!asked.wa){asked.wa=1;ask('wa','¿Te gustaría un recordatorio diario para no perder la racha?');return}
      p=Math.min(100,p+1.25);draw();
      if(p>=100){clearInterval(loadTimer);loadTimer=null;
        setTimeout(function(){if(ORDER[idx]!=='load')return;var r=ORDER.indexOf('res');try{history.replaceState({s:r},'')}catch(e){}render(r)},400)}
    },30);
  }

  function initScratch(){
    var card=document.getElementById('scard'), cv=document.getElementById('scv'), prize=document.getElementById('prize');
    var r=card.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
    var cx=cv.getContext('2d');
    var g=cx.createLinearGradient(0,0,cv.width,cv.height);g.addColorStop(0,'#2563EB');g.addColorStop(1,'#5B8DEF');
    cx.fillStyle=g;cx.fillRect(0,0,cv.width,cv.height);
    cx.fillStyle='rgba(255,255,255,.12)';
    for(var i=0;i<cv.width;i+=18*dpr)for(var j=(i/(18*dpr))%2?9*dpr:0;j<cv.height;j+=18*dpr){cx.beginPath();cx.arc(i,j,2*dpr,0,7);cx.fill()}
    cx.fillStyle='#fff';cx.textAlign='center';cx.textBaseline='middle';
    cx.font='800 '+(22*dpr)+'px "Plus Jakarta Sans",sans-serif';cx.fillText('Raspa aquí',cv.width/2,cv.height/2-12*dpr);
    cx.font='600 '+(14*dpr)+'px "Plus Jakarta Sans",sans-serif';cx.fillText('con tu dedo o el mouse',cv.width/2,cv.height/2+16*dpr);
    prize.innerHTML=prizeHTML(); // se pinta debajo, oculto por el canvas
    cx.globalCompositeOperation='destination-out';
    var down=false,last=null,moves=0;
    function pos(e){var b=cv.getBoundingClientRect();return {x:(e.clientX-b.left)*dpr,y:(e.clientY-b.top)*dpr}}
    function scratch(p){cx.lineWidth=44*dpr;cx.lineCap='round';cx.beginPath();if(last){cx.moveTo(last.x,last.y)}else{cx.moveTo(p.x,p.y)}cx.lineTo(p.x+.1,p.y+.1);cx.stroke();last=p;
      if(++moves%6===0&&cleared()>.45)reveal()}
    function cleared(){var d=cx.getImageData(0,0,cv.width,cv.height).data,n=0,t=0;for(var k=3;k<d.length;k+=64){t++;if(d[k]===0)n++}return n/t}
    cv.addEventListener('pointerdown',function(e){down=true;last=null;try{cv.setPointerCapture(e.pointerId)}catch(x){}scratch(pos(e))});
    cv.addEventListener('pointermove',function(e){if(down)scratch(pos(e))});
    ['pointerup','pointercancel','pointerleave'].forEach(function(t){cv.addEventListener(t,function(){down=false;last=null})});
  }
  function reveal(){
    if(revealed)return;revealed=true;
    var card=document.getElementById('scard');if(card)card.classList.add('done');
    var p=document.getElementById('prize');if(p&&!p.querySelector('.pc'))p.innerHTML=prizeHTML();
    var n=document.getElementById('snext');if(n)n.disabled=false;
    var l=app.querySelector('[data-reveal]');if(l)l.remove();
  }

  function startClock(){
    var el=document.getElementById('cd'), end=sundayEnd();
    function tick(){var s=Math.max(0,Math.floor((end-new Date())/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
      function z(v){return (v<10?'0':'')+v}
      el.textContent=(d?d+' d ':'')+z(h)+':'+z(m)+':'+z(x)}
    tick();clock=setInterval(tick,1000);
  }

  function answers(kind){
    var a={};Object.keys(A).forEach(function(k){a[k]=A[k]});
    a.in=kind;a.pa=PA;a.ct=CT;
    if(JSON.stringify(a).length>700)delete a.te;
    if(JSON.stringify(a).length>700)delete a.he;
    return a;
  }
  // Mismas reglas que valida funnel_lead en el servidor.
  function validContact(c){
    if(CT==='e')return /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i.test(c)&&c.length<=120;
    var d=c.replace(/\D/g,'');return d.length>=8&&d.length<=15;
  }
  function lead(c,kind){
    return rpc('funnel_lead',{p_slug:SLUG,p_variant:V,p_contact:c,p_answers:answers(kind)})
      .then(function(r){return r.json()}).then(function(res){if(res!==true)throw 0;CONTACT=c;PENDING=null});
  }

  function send(kind,btn){
    var inp=document.getElementById('cin'), err=document.getElementById('cerr'), c=(inp.value||'').trim();
    if(!validContact(c)){err.textContent=CT==='e'?'Revisa tu correo: parece que le falta algo.':'Revisa tu número: escríbelo con el código de país.';err.hidden=false;inp.focus();return}
    err.hidden=true;
    if(kind==='q'){
      // El contacto se guarda junto con la pregunta de anclaje de la siguiente pantalla (un solo funnel_lead).
      if(c!==CONTACT)PENDING=c;
      goId('anc');return;
    }
    if(c===CONTACT){render(idx);return}
    var label=btn.textContent;btn.disabled=true;btn.textContent='Guardando…';
    lead(c,'p').then(function(){render(idx)})
      .catch(function(){btn.disabled=false;btn.textContent=label;err.textContent='No se pudo guardar. Revisa tu conexión e intenta de nuevo.';err.hidden=false});
  }

  function answerAnchor(b){
    A.pr=b.getAttribute('data-anc');
    app.querySelectorAll('[data-anc]').forEach(function(x){x.classList.toggle('sel',x===b)});
    if(!PENDING){setTimeout(next,170);return}
    var all=app.querySelectorAll('[data-anc]'),err=document.getElementById('aerr');
    all.forEach(function(x){x.disabled=true});err.hidden=true;
    lead(PENDING,'q').then(next).catch(function(){
      all.forEach(function(x){x.disabled=false});
      err.innerHTML='No pudimos guardar tu contacto. Toca otra vez tu respuesta para reintentar o <button type="button" class="link" style="display:inline;margin:0;padding:0" data-fix>revisa tu correo o WhatsApp</button>.';
      err.hidden=false;
    });
  }
  // Si se va de la página con el contacto escrito pero sin responder el anclaje, igual lo guardamos.
  window.addEventListener('pagehide',function(){if(PENDING&&!CONTACT){var c=PENDING;PENDING=null;try{rpc('funnel_lead',{p_slug:SLUG,p_variant:V,p_contact:c,p_answers:answers('q')})}catch(e){}}});

  app.addEventListener('click',function(e){
    var t=e.target&&e.target.closest?e.target:null;if(!t)return;
    var b;
    if(b=t.closest('[data-pick]')){
      var kv=b.getAttribute('data-pick').split(':');A[kv[0]]=kv[1];
      if(kv[0]==='g'&&!started){started=true;track('quiz_start')}
      app.querySelectorAll('[data-pick]').forEach(function(x){x.classList.toggle('sel',x===b)});
      setTimeout(next,170);return;
    }
    if(b=t.closest('[data-yn]')){
      var y=b.getAttribute('data-yn').split(':');A[y[0]]=+y[1];
      app.querySelectorAll('[data-yn]').forEach(function(x){x.classList.toggle('sel',x===b)});
      setTimeout(next,170);return;
    }
    if(b=t.closest('[data-tog]')){
      var m=b.getAttribute('data-tog').split(':'),k=m[0],v=m[1],q=Q[k],cur=(A[k]||[]).slice(),at=cur.indexOf(v);
      if(at>-1)cur.splice(at,1);
      else if(q.none&&v===q.none)cur=[v];
      else{if(q.none)cur=cur.filter(function(x){return x!==q.none});cur.push(v)}
      A[k]=cur;
      app.querySelectorAll('[data-tog]').forEach(function(x){x.setAttribute('aria-pressed',cur.indexOf(x.getAttribute('data-tog').split(':')[1])>-1)});
      var nb=app.querySelector('[data-next]');if(nb)nb.disabled=!cur.length;
      return;
    }
    if(b=t.closest('[data-anc]')){answerAnchor(b);return}
    if(b=t.closest('[data-fix]')){history.back();return}
    if(b=t.closest('[data-next]')){if(!b.disabled)next();return}
    if(b=t.closest('[data-reveal]')){reveal();return}
    if(b=t.closest('[data-ct]')){
      CT=b.getAttribute('data-ct');
      var kind=app.querySelector('[data-send]').getAttribute('data-send');
      document.getElementById('cform').outerHTML=contactForm(kind);
      document.getElementById('cin').focus();
      return;
    }
    if(b=t.closest('[data-send]')){send(b.getAttribute('data-send'),b);return}
    if(b=t.closest('[data-skip]')){PENDING=null;goId('anc');return}
    if(b=t.closest('[data-buy]')){
      track('cta');
      var url=CHECKOUT[PA]||'';
      if(url){location.href=url}else{goId('pre')}
      return;
    }
  });
  app.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target&&e.target.id==='cin'){var b=app.querySelector('[data-send]');if(b&&!b.disabled)send(b.getAttribute('data-send'),b)}
  });

  try{history.replaceState({s:0},'')}catch(e){}
  render(0);
})();
</script>
